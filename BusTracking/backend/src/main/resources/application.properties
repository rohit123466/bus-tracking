spring.application.name=bus-tracker

# PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/dtc_bus_tracker
spring.datasource.username=dtc_user
spring.datasource.password=dtc_pass
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Redis
spring.data.redis.host=localhost
spring.data.redis.port=6379

# Server
server.port=8080
# JSON answers (nearby stops with arrivals, stop search) shrink 5-8x with gzip. /buses/regional
# sends its own pre-compressed body, which Tomcat leaves alone.
server.compression.enabled=true
server.compression.mime-types=application/json,text/css,application/javascript
server.compression.min-response-size=1024

# Connection pool: enough connections for the feed writer, ticketing and admin queries at once
# without queueing, a few kept open so a request does not pay for a new connection, and a caller
# told within 20 s when the database cannot be reached.
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX:20}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:5}
spring.datasource.hikari.connection-timeout=20000

# Actuator
management.endpoints.web.exposure.include=health,info,metrics
spring.profiles.active=local

# CORS - comma-separated list, overridden per-profile
cors.allowed-origins=http://localhost:3000,http://localhost:5173
# The OTD feed is regenerated about every 11 s and supports ETags: polls that find it unchanged are
# a body-less 304 and do no further work. Every 2 s picks a new file up ~1 s after it is published
# on average (4 s: ~2 s). Not faster: OTD answers 503 above about 1.5 requests per second per key,
# and a local and a hosted instance often share one key (measured 12 Nov 2026: two pollers at 1 s
# got 23% 503s, at 2 s none).
dtc.poll.interval=2000

# GTFS carries no per-vehicle seat map, so the wheelchair-reserved space count
# is a fixed value reflecting DTC's standard low-floor bus fit-out rather than
# feed data. Applied wherever a route/bus is reported wheelchair-accessible.
dtc.accessibility.wheelchair-spaces=2

# Seat-level ticketing DEMO configuration (TicketingProperties). Capacities
# are a demo fit-out per bus type, not a claim about every real DTC bus; the
# wheelchair space is extra to (not one of) the passenger seats.
ticketing.low-floor.seats=35
ticketing.low-floor.priority-seats=4
ticketing.low-floor.wheelchair-spaces=1
ticketing.standard.seats=32
ticketing.standard.priority-seats=4
ticketing.standard.wheelchair-spaces=0
# Demo fares only - NOT official DTC fares or concessions.
ticketing.fare.currency=INR
ticketing.fare.base=5.00
ticketing.fare.per-stop=5.00
ticketing.fare.senior-concession-percent=50
ticketing.fare.accessibility-fare=5.00
# Simulated camera (no real computer vision): chance per seat that a scan
# disagrees with ticket data, so mismatch detection has something to show.
ticketing.camera.simulated-mismatch-rate=0.08
# Standing-area monitoring. Camera buses receive standing-area frames from the
# preset scenarios in presets-location every feed-interval-ms; a real device
# posts the same frames to /api/conductor/buses/{bus}/camera/standing-frames.
# A person counts after confirm-frames consecutive sightings and is dropped
# after release-frames consecutive misses; no frame for signal-timeout-ms
# means the signal is lost and the last confirmed reading is held.
ticketing.camera.feed-enabled=true
ticketing.camera.feed-interval-ms=2000
ticketing.camera.signal-timeout-ms=8000
ticketing.camera.confirm-frames=2
ticketing.camera.release-frames=3
ticketing.camera.min-confidence=0.5
ticketing.camera.presets-location=classpath:camera/standing-presets.json

# JWT (admin dashboard auth only - all rider-facing endpoints stay public)
jwt.secret=${JWT_SECRET:dev-only-insecure-secret-change-me-please-32-bytes-minimum}
jwt.expiration-ms=86400000
admin.default-username=${ADMIN_USERNAME:admin}
admin.default-password=${ADMIN_PASSWORD:admin123}

# Swagger / OpenAPI
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
# Full-feed live rider APIs; GTFS IDs are separate from legacy database IDs.
transit.gtfs-resource=${GTFS_RESOURCE:classpath:static/GTFS.zip}
dtc.trip-updates.url=${DTC_TRIP_UPDATES_URL:}
walking.ors-key=${ORS_API_KEY:}
walking.ors-url=${ORS_WALKING_URL:https://api.openrouteservice.org/v2/directions/foot-walking/geojson}

# Liveness/readiness groups (/actuator/health/liveness, /actuator/health/readiness)
management.endpoint.health.probes.enabled=true

# Admin login throttling (LoginAttemptLimiter): failures per client address before lockout.
auth.login.max-failures=5
auth.login.lockout-minutes=15

# Journey Replay history (bus_locations) older than this is purged hourly; 0 keeps everything.
bus.history.retention-hours=${BUS_HISTORY_RETENTION_HOURS:24}
transit.learned-routes.file=${LEARNED_ROUTES_FILE:./data/learned-routes.txt}
