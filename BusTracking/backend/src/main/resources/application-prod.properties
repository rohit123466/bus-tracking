dtc.api.url=https://otd.delhi.gov.in/api/realtime/VehiclePositions.pb
dtc.api.key=${DTC_API_KEY}

# Postgres (Neon) connection comes from PGHOST/PGPORT/PGDATABASE/PGUSER/PGPASSWORD.
# Neon only accepts TLS, so sslmode defaults to require; set PGSSLMODE=disable for a
# local Postgres without TLS (docker-compose does).
spring.datasource.url=jdbc:postgresql://${PGHOST}:${PGPORT:5432}/${PGDATABASE}?sslmode=${PGSSLMODE:require}
spring.datasource.username=${PGUSER}
spring.datasource.password=${PGPASSWORD}
spring.jpa.show-sql=false

# Redis connection comes from REDIS_URL (redis://[:password@]host:port)
spring.data.redis.url=${REDIS_URL}

# The host (Render/Railway) injects PORT; Spring binds to it directly
server.port=${PORT:8080}

cors.allowed-origins=${CORS_ALLOWED_ORIGINS}

# Local/dev/demo import a box covering North Delhi and North West Delhi for
# fast iteration; prod imports the full Delhi/NCR feed (radius-degrees<=0 disables the filter)
# so real users outside central Delhi get coverage. One-time cost on first
# boot only - GtfsImportService skips re-import once routes already exist.
gtfs.import.radius-degrees=0

# No fallbacks in prod: a missing variable fails startup, and ProductionSafetyCheck
# rejects weak values (short JWT secret, default admin password, wildcard CORS).
jwt.secret=${JWT_SECRET}
admin.default-password=${ADMIN_PASSWORD}

# Render terminates TLS at its proxy; trust X-Forwarded-* from internal proxy
# addresses only, so request.getRemoteAddr() is the real client (login throttling)
# and a client cannot spoof it with its own X-Forwarded-For header.
server.forward-headers-strategy=native

# Only health/info are public; metrics and API docs reveal internals.
management.endpoints.web.exposure.include=health,info
springdoc.api-docs.enabled=${API_DOCS_ENABLED:false}
springdoc.swagger-ui.enabled=${API_DOCS_ENABLED:false}
