# Serves the React build and forwards API + WebSocket traffic to the backend
# container (service name "backend" in docker-compose.yml).

# Vite puts a content hash in every asset name, so those are cached forever;
# index.html is never cached so a redeploy is picked up on the next load. API
# responses keep the backend's own caching headers (empty value = not added).
map $uri $cache_control {
    ~^/assets/  "public, max-age=31536000, immutable";
    ~^/(api|ws) "";
    default     "no-cache";
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Declared once at server level: an add_header inside a location would
    # silently drop all of these for that location.
    add_header Cache-Control $cache_control always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    # The app asks for the rider's location; nothing else.
    add_header Permissions-Policy "geolocation=(self), camera=(), microphone=()" always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SockJS/STOMP live bus updates.
    location /ws {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }

    location /assets/ {
        try_files $uri =404;
    }

    # SPA fallback for client-side routes (/route, /admin, ...).
    location / {
        try_files $uri /index.html;
    }
}
