version: 2
updates:
  - package-ecosystem: maven
    directory: /BusTracking/backend
    schedule:
      interval: weekly
    groups:
      spring:
        patterns: ["org.springframework*"]
  - package-ecosystem: npm
    directory: /BusTracking/frontend
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: docker
    directory: /BusTracking/backend
    schedule:
      interval: monthly
  - package-ecosystem: docker
    directory: /BusTracking/frontend
    schedule:
      interval: monthly
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
