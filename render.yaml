# Render Blueprint for the DTC Bus Tracker (lives at the repo root; the app is in BusTracking/).
# Deploy: Render dashboard -> New -> Blueprint -> pick this repo.
#
# The database is Neon Postgres (https://neon.tech), not a Render database.
# On the first deploy, fill in the `sync: false` values marked below (Neon PG* vars,
# DTC_API_KEY, CORS_ALLOWED_ORIGINS, VITE_API_URL) - see BusTracking/DEPLOY.md.

services:
  # Spring Boot API + WebSocket
  - type: web
    name: bus-tracker-api
    runtime: docker
    plan: free
    dockerfilePath: ./BusTracking/backend/Dockerfile
    dockerContext: ./BusTracking/backend
    healthCheckPath: /actuator/health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      # Neon Postgres: copy these from the Neon dashboard (Connect -> Parameters only).
      # Use the direct host (ep-...neon.tech), not the -pooler one; Hikari already pools.
      - key: PGHOST
        sync: false
      - key: PGDATABASE
        sync: false
      - key: PGUSER
        sync: false
      - key: PGPASSWORD
        sync: false
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: bus-tracker-redis
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_PASSWORD
        generateValue: true
      # Delhi OTD realtime API key.
      - key: DTC_API_KEY
        sync: false
      # Exact origin of the frontend, no trailing slash,
      # e.g. https://bus-tracker-web.onrender.com
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      # Import only North/North West Delhi (fits a 512MB instance). Set to 0 to
      # import the full Delhi feed - needs a bigger plan and a much longer first boot.
      - key: GTFS_IMPORT_RADIUS_DEGREES
        value: "0.16"

  # React + Vite frontend
  - type: web
    name: bus-tracker-web
    runtime: static
    rootDir: BusTracking/frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: NODE_VERSION
        value: "22"
      # Public URL of the API including /api,
      # e.g. https://bus-tracker-api.onrender.com/api (baked in at build time).
      - key: VITE_API_URL
        sync: false
    routes:
      # SPA fallback for BrowserRouter deep links (/route/123, /admin, ...).
      - type: rewrite
        source: /*
        destination: /index.html

  # Render Key Value (Redis-compatible) for the live bus-position store.
  - type: keyvalue
    name: bus-tracker-redis
    plan: free
    maxmemoryPolicy: allkeys-lru
    ipAllowList: []

